<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pharmacy Quick Sale (Table View)</title>
  <style>
    #searchResultsTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    #searchResultsTable th,
    #searchResultsTable td {
      border: 1px solid #ccc;
      padding: 6px 10px;
      text-align: left;
    }
    #searchResultsTable .selected {
      background-color: #d0e7ff;
      font-weight: bold;
    }
    #searchResultsContainer {
      max-height: 300px;
      overflow-y: auto;
      width: 600px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    input#searchInput {
      width: 500px;
      padding: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2>Quick Sale / Add to Cart</h2>
<input type="text" id="searchInput" placeholder="Search drug name..." autofocus />

<div id="searchResultsContainer">
  <table id="searchResultsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Quantity</th>
        <th>Price (PKR)</th>
      </tr>
    </thead>
    <tbody id="searchResultsBody">
      <!-- Results will appear here -->
    </tbody>
  </table>
</div>

<hr />

<h2>Shopping Cart</h2>
<table border="1" id="cartTable">
  <thead>
    <tr><th>Name</th><th>Quantity</th><th>Price</th></tr>
  </thead>
  <tbody id="cartTableBody">
    <!-- Cart items -->
  </tbody>
</table>
<div id="cartTotal">Total: PKR 0.00</div>

<script>
const searchInput = document.getElementById('searchInput');
const resultsBody = document.getElementById('searchResultsBody');
let selectedIndex = -1;
let quantityModeItem = null;
let quantityInputBuffer = '';

// --- Dummy Inventory ---
let inventoryList = [
    { id: 1, name: "Pain Relief Tablets 20mg", quantity: 50, price: 20.50 },
    { id: 8, name: "Pain Relief Tablets 10mg", quantity: 60, price: 10.50 },
    { id: 2, name: "Allergy Medication", quantity: 20, price: 15.00 },
    { id: 3, name: "Cough Syrup", quantity: 15, price: 8.75 },
    { id: 4, name: "Vitamin C Supplement", quantity: 100, price: 22.00 },
    { id: 5, name: "Band-Aids (Box)", quantity: 75, price: 5.00 },
];

// --- Render Search Results as Table Rows ---
function filterAndDisplayResults(searchTerm) {
    resultsBody.innerHTML = '';
    selectedIndex = -1;

    if (!searchTerm.trim()) return;

    const filtered = inventoryList
        .filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()))
        .slice(0, 10);

    filtered.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.quantity}</td>
            <td>PKR ${item.price.toFixed(2)}</td>
        `;
        tr.dataset.itemId = item.id;
        tr.dataset.index = index;

        if (index === 0) {
            tr.classList.add('selected');
            selectedIndex = 0;
        }

        resultsBody.appendChild(tr);
    });
}

// --- Update Row Selection ---
function updateSelection(newIndex) {
    const rows = Array.from(resultsBody.querySelectorAll('tr'));

    if (selectedIndex >= 0 && rows[selectedIndex]) {
        rows[selectedIndex].classList.remove('selected');
    }

    selectedIndex = newIndex;
    if (rows[selectedIndex]) {
        rows[selectedIndex].classList.add('selected');
        rows[selectedIndex].scrollIntoView({ block: 'nearest', behavior: 'auto' });
    }
}

// --- Keyboard Handler ---
document.addEventListener('keydown', (event) => {
    const rows = Array.from(resultsBody.querySelectorAll('tr'));
    const isNumberKey = /^\d$/.test(event.key);

    // --- Quantity Input Mode ---
    if (quantityModeItem !== null) {
        if (isNumberKey) {
            quantityInputBuffer += event.key;
            console.log(`Quantity buffer: ${quantityInputBuffer}`);
            clearTimeout(window.qtyTimer);
            window.qtyTimer = setTimeout(() => {
                const qty = parseInt(quantityInputBuffer, 10);
                if (qty > 0) addToCart(quantityModeItem, qty);
                exitQuantityMode();
            }, 500);
            return;
        }

        if (event.key === 'Enter') {
            const qty = parseInt(quantityInputBuffer || '1', 10);
            if (qty > 0) addToCart(quantityModeItem, qty);
            exitQuantityMode();
            return;
        }

        // Cancel on any other key
        exitQuantityMode();
        return;
    }

    // --- Navigation Mode ---
    if (rows.length === 0) return;

    if (['ArrowUp', 'ArrowDown', 'Enter'].includes(event.key)) {
        event.preventDefault();
    }

    if (event.key === 'ArrowDown') {
        const newIndex = Math.min(selectedIndex + 1, rows.length - 1);
        updateSelection(newIndex);
    } 
    else if (event.key === 'ArrowUp') {
        const newIndex = Math.max(selectedIndex - 1, 0);
        updateSelection(newIndex);
    }
    else if (event.key === 'Enter' && selectedIndex >= 0) {
        const row = rows[selectedIndex];
        const itemId = parseInt(row.dataset.itemId, 10);
        const item = inventoryList.find(i => i.id === itemId);
        if (item) {
            quantityModeItem = item;
            quantityInputBuffer = '';
            console.log(`\n**Waiting for quantity input for: ${item.name}**\n`);
        }
    }
});

// --- Exit Quantity Mode ---
function exitQuantityMode() {
    quantityModeItem = null;
    quantityInputBuffer = '';
    searchInput.value = '';
    searchInput.focus();
    filterAndDisplayResults('');
}

// --- Cart Logic ---
let shoppingCart = [];

function addToCart(item, quantity = 1) {
    const qty = Math.floor(quantity);
    if (qty <= 0 || !item) return;

    const existing = shoppingCart.find(i => i.id === item.id);
    if (existing) {
        existing.cartQuantity += qty;
    } else {
        shoppingCart.push({ ...item, cartQuantity: qty });
    }
    renderCart();
}

function renderCart() {
    const cartBody = document.getElementById('cartTableBody');
    cartBody.innerHTML = '';
    let total = 0;

    shoppingCart.forEach(item => {
        const row = cartBody.insertRow();
        row.insertCell().textContent = item.name;
        row.insertCell().textContent = item.cartQuantity;
        const subtotal = item.price * item.cartQuantity;
        row.insertCell().textContent = `PKR ${subtotal.toFixed(2)}`;
        total += subtotal;
    });

    document.getElementById('cartTotal').textContent = `Total: PKR ${total.toFixed(2)}`;
}

// --- Search Input Listener ---
searchInput.addEventListener('input', (e) => {
    if (quantityModeItem === null) {
        filterAndDisplayResults(e.target.value);
    }
});

// Initial empty render
filterAndDisplayResults('');
</script>

</body>
</html>

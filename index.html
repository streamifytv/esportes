<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pharmacy Quick Sale</title>
  <style>
    #searchResults .selected {
      background-color: #cce5ff;
      font-weight: bold;
    }
    #searchResults li {
      padding: 6px 10px;
      cursor: pointer;
      list-style: none;
      border-bottom: 1px solid #eee;
    }
    #searchResults li:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

<!-- New Search and Results Area -->
<h2>Quick Sale / Add to Cart</h2>
<input type="text" id="searchInput" placeholder="Search drug name..." autofocus />

<div id="searchResultsContainer" style="max-height: 300px; overflow-y: auto; width: 500px; border: 1px solid #ccc;">
    <ul id="searchResults">
        <!-- Filtered inventory items will go here -->
    </ul>
</div>

<hr />
<!-- New Shopping Cart Area -->
<h2>Shopping Cart</h2>
<table border="1" id="cartTable">
    <thead>
        <tr><th>Name</th><th>Quantity</th><th>Price</th></tr>
    </thead>
    <tbody id="cartTableBody">
        <!-- Cart items will be inserted here -->
    </tbody>
</table>
<div id="cartTotal">Total: PKR 0.00</div>

<script>
const searchInput = document.getElementById('searchInput');
const searchResultsUl = document.getElementById('searchResults');
let selectedIndex = -1;
let quantityModeItem = null;
let quantityInputBuffer = '';

// --- 1. Dummy Inventory (replace with IndexedDB later) ---
let inventoryList = [
    { id: 1, name: "Pain Relief Tablets 20mg", quantity: 50, price: 20.50 },
    { id: 8, name: "Pain Relief Tablets 10mg", quantity: 60, price: 10.50 },
    { id: 2, name: "Allergy Medication", quantity: 20, price: 15.00 },
    { id: 3, name: "Cough Syrup", quantity: 15, price: 8.75 },
    { id: 4, name: "Vitamin C Supplement", quantity: 100, price: 22.00 },
    { id: 5, name: "Band-Aids (Box)", quantity: 75, price: 5.00 },
];

// --- 2. Filter and Display Results ---
function filterAndDisplayResults(searchTerm) {
    searchResultsUl.innerHTML = '';
    selectedIndex = -1;

    if (!searchTerm.trim()) {
        return;
    }

    const filteredItems = inventoryList
        .filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()))
        .slice(0, 10);

    filteredItems.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = `${item.name} (Qty: ${item.quantity})`;
        li.dataset.itemId = item.id;
        li.dataset.index = index;

        if (index === 0) {
            li.classList.add('selected');
            selectedIndex = 0;
        }

        searchResultsUl.appendChild(li);
    });
}

// --- 3. Update Selection Highlight and Scroll ---
function updateSelection(results, newIndex) {
    if (selectedIndex >= 0 && results[selectedIndex]) {
        results[selectedIndex].classList.remove('selected');
    }

    selectedIndex = newIndex;
    if (results[selectedIndex]) {
        results[selectedIndex].classList.add('selected');
        results[selectedIndex].scrollIntoView({ block: 'nearest' });
    }
}

// --- 4. Keyboard Navigation & Quantity Input ---
document.addEventListener('keydown', handleKeyboardNavigation);

function handleKeyboardNavigation(event) {
    const results = Array.from(searchResultsUl.querySelectorAll('li'));
    const isNumberKey = /^\d$/.test(event.key);

    // --- Quantity Input Mode ---
    if (quantityModeItem !== null) {
        if (isNumberKey) {
            quantityInputBuffer += event.key;
            console.log(`Quantity buffer: ${quantityInputBuffer}`);
            clearTimeout(window.qtyTimer);
            window.qtyTimer = setTimeout(() => {
                const finalQty = parseInt(quantityInputBuffer, 10);
                if (finalQty > 0) {
                    addToCart(quantityModeItem, finalQty);
                }
                exitQuantityMode();
            }, 500);
            return;
        }

        if (event.key === 'Enter') {
            const finalQty = parseInt(quantityInputBuffer || '1', 10);
            if (finalQty > 0) {
                addToCart(quantityModeItem, finalQty);
            }
            exitQuantityMode();
            return;
        }

        // Any other key cancels quantity mode
        exitQuantityMode();
        return;
    }

    // --- Navigation/Search Mode ---
    if (results.length === 0) return;

    if (['ArrowUp', 'ArrowDown', 'Enter'].includes(event.key)) {
        event.preventDefault();
    }

    if (event.key === 'ArrowDown') {
        const newIndex = Math.min(selectedIndex + 1, results.length - 1);
        updateSelection(results, newIndex);
    } 
    else if (event.key === 'ArrowUp') {
        const newIndex = Math.max(selectedIndex - 1, 0);
        updateSelection(results, newIndex);
    } 
    else if (event.key === 'Enter' && selectedIndex >= 0) {
        const selectedLi = results[selectedIndex];
        const itemId = parseInt(selectedLi.dataset.itemId, 10);
        const item = inventoryList.find(i => i.id === itemId);
        if (item) {
            quantityModeItem = item;
            quantityInputBuffer = '';
            console.log(`\n**Waiting for quantity input for: ${item.name}**\n`);
        }
    }
}

// Helper: Exit quantity mode cleanly
function exitQuantityMode() {
    quantityModeItem = null;
    quantityInputBuffer = '';
    searchInput.focus();
    searchInput.value = '';
    filterAndDisplayResults('');
}

// --- 5. Cart Management ---
let shoppingCart = [];

function addToCart(item, quantity = 1) {
    const qty = parseInt(quantity, 10);
    if (qty <= 0 || !item) return;

    const existing = shoppingCart.find(i => i.id === item.id);
    if (existing) {
        existing.cartQuantity += qty;
    } else {
        shoppingCart.push({ ...item, cartQuantity: qty });
    }

    renderCart();
    exitQuantityMode();
}

function renderCart() {
    const cartBody = document.getElementById('cartTableBody');
    cartBody.innerHTML = '';
    let total = 0;

    shoppingCart.forEach(item => {
        const row = cartBody.insertRow();
        row.insertCell().textContent = item.name;
        row.insertCell().textContent = item.cartQuantity;
        const subtotal = item.price * item.cartQuantity;
        row.insertCell().textContent = `PKR ${subtotal.toFixed(2)}`;
        total += subtotal;
    });

    document.getElementById('cartTotal').textContent = `Total: PKR ${total.toFixed(2)}`;
}

// --- 6. Search Input Listener ---
searchInput.addEventListener('input', (e) => {
    if (quantityModeItem === null) {
        filterAndDisplayResults(e.target.value);
    }
});

// Initial empty render
filterAndDisplayResults('');
</script>

</body>
</html>
